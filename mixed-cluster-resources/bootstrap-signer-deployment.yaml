apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootstrap-signer
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:bootstrap-signer
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:bootstrap-signer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:bootstrap-signer
subjects:
  - kind: ServiceAccount
    name: bootstrap-signer
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: system:bootstrap-signer
  namespace: kube-public
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:bootstrap-signer
  namespace: kube-public
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: system:bootstrap-signer
subjects:
  - kind: ServiceAccount
    name: bootstrap-signer
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bootstrap-signer
  namespace: kube-system
  labels:
    app: bootstrap-signer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bootstrap-signer
  template:
    metadata:
      labels:
        app: bootstrap-signer
    spec:
      serviceAccountName: bootstrap-signer
      containers:
        - name: bootstrap-signer
          image: registry.k8s.io/kube-controller-manager:v1.33.3
          command:
            - kube-controller-manager
            - --controllers=bootstrapsigner,tokencleaner
            - --leader-elect=false
            - --kubeconfig=/etc/kubernetes/kubeconfig
            - --root-ca-file=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --service-account-private-key-file=/var/run/secrets/kubernetes.io/serviceaccount/token
            - --use-service-account-credentials=true
            - --v=2
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kubernetes
              readOnly: true
      volumes:
        - name: kubeconfig
          configMap:
            name: bootstrap-signer-kubeconfig
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bootstrap-signer-kubeconfig
  namespace: kube-system
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        server: https://kubernetes.default.svc
      name: default
    contexts:
    - context:
        cluster: default
        user: default
      name: default
    current-context: default
    users:
    - name: default
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
